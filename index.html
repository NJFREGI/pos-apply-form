<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>申込フォーム | NJF REGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .must { background: #e3342f; color: white; padding: 1px 5px; font-size: 10px; border-radius: 2px; margin-left: 5px; vertical-align: middle; }
        canvas { border: 1px solid #ccc; background: #fff; width: 100%; height: 200px; touch-action: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 antialiased">

<div class="max-w-xl mx-auto min-h-screen bg-white shadow-lg">
    <div class="bg-[#1a365d] p-6 text-white text-center">
        <h1 class="text-xl font-bold">NJF REGI サービス利用申込</h1>
        <p class="text-xs mt-1 opacity-80">新日本富士アシスト株式会社</p>
    </div>

    <form id="applyForm" class="p-5 space-y-6">
        <section>
            <h2 class="font-bold border-l-4 border-blue-900 pl-2 mb-3 text-lg">1. 重要事項説明 <span class="must">必須</span></h2>
            <div class="bg-gray-50 border p-3 text-xs leading-relaxed h-40 overflow-y-scroll mb-3">
                <p>・本サービスの最低利用期間は24ヶ月です。[cite: 5]</p>
                <p>・中途解約時は残余期間分の料金が発生します。[cite: 6]</p>
                <p>・データ保存期間は最大24ヶ月です。[cite: 9]</p>
                <p>・解約は1ヶ月前に書面での申請が必要です。[cite: 22]</p>
            </div>
            <label class="flex items-start text-sm font-bold">
                <input type="checkbox" name="terms" required class="mt-1 mr-2 w-5 h-5">
                <span>上記の内容を確認し、同意します。</span>
            </label>
        </section>

        <section class="space-y-4">
            <h2 class="font-bold border-l-4 border-blue-900 pl-2 mb-3 text-lg">2. お客様情報</h2>
            <div>
                <label class="text-sm font-bold block">店舗名 <span class="must">必須</span></label>
                <input type="text" name="storeName" required class="w-full border-b-2 border-gray-300 p-2 outline-none focus:border-blue-900" placeholder="例：銀河苑">
            </div>
            <div>
                <label class="text-sm font-bold block">設置先住所 <span class="must">必須</span></label>
                <input type="text" name="address" required class="w-full border-b-2 border-gray-300 p-2 outline-none" placeholder="滋賀県高島市...">
            </div>
            <div>
                <label class="text-sm font-bold block">電話番号 <span class="must">必須</span></label>
                <input type="tel" name="phone" required class="w-full border-b-2 border-gray-300 p-2 outline-none" placeholder="0740-37-6088">
            </div>
        </section>

        <section>
            <h2 class="font-bold border-l-4 border-blue-900 pl-2 mb-3 text-lg">3. 機器数量</h2>
            <div class="flex justify-between items-center py-2 border-b">
                <span class="text-sm">レジスター (88,000円/税込)</span>
                <input type="number" name="regQty" value="1" min="0" class="w-16 border rounded p-1 text-center">
            </div>
            <div class="flex justify-between items-center py-2 border-b">
                <span class="text-sm">プリンター (25,300円/税込)</span>
                <input type="number" name="prtQty" value="3" min="0" class="w-16 border rounded p-1 text-center">
            </div>
        </section>

        <section>
            <h2 class="font-bold border-l-4 border-blue-900 pl-2 mb-3 text-lg">4. ご署名 <span class="must">必須</span></h2>
            <canvas id="sig-canvas" class="rounded shadow-inner"></canvas>
            <button type="button" id="sig-clearBtn" class="text-xs text-gray-500 mt-2 underline">サインを書き直す</button>
        </section>

        <button type="submit" class="w-full bg-[#1a365d] text-white py-4 rounded-lg font-bold text-lg shadow-md active:bg-blue-800">
            内容を確認して送信
        </button>
    </form>
</div>

<script>
    // 签名功能脚本
    const canvas = document.getElementById('sig-canvas');
    const ctx = canvas.getContext('2d');
    let drawing = false;

    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        return { x: (e.clientX || e.touches[0].clientX) - rect.left, y: (e.clientY || e.touches[0].clientY) - rect.top };
    }
    const start = (e) => { drawing = true; const p = getPos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const move = (e) => { if(!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    const end = () => drawing = false;

    canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
    canvas.addEventListener('touchstart', start); canvas.addEventListener('touchmove', move); canvas.addEventListener('touchend', end);
    document.getElementById('sig-clearBtn').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 表单提交
    document.getElementById('applyForm').onsubmit = async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true; btn.innerText = "送信中...";

        const formData = new FormData(e.target);
        const data = Object.fromEntries(formData.entries());
        data.signature = canvas.toDataURL(); // 获取签名图片
        data.applyDate = new Date().toLocaleDateString('ja-JP');

        try {
            await fetch('https://script.google.com/macros/s/AKfycbwIP-XgdD0fqd4Zhe3tsN7iAWXoIuiEs_7jVBEH6ZXGmESG_4qxNde8k0hrgwAKscz56w/exec', {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify(data)
            });
            alert('お申し込みが完了しました。PDF契約書をメールで送付いたしました。');
        } catch (err) {
            alert('エラーが発生しました。');
        } finally {
            btn.disabled = false; btn.innerText = "内容を確認して送信";
        }
    };
</script>
</body>
</html>
