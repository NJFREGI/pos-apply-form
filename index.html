<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>サービス利用申込 | NJF REGI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://yubinbango.github.io/yubinbango/yubinbango.js" charset="UTF-8"></script>
    <style>
        .must { background: #ff4d4f; color: white; padding: 2px 4px; font-size: 10px; border-radius: 2px; margin-left: 4px; }
        .signature-pad { border: 2px dashed #cbd5e1; background: #fafafa; touch-action: none; border-radius: 12px; cursor: crosshair; }
        input { font-size: 16px !important; }
    </style>
</head>
<body class="bg-slate-200">
    <div class="max-w-xl mx-auto min-h-screen bg-white shadow-2xl h-adr">
        <span class="p-country-name" style="display:none;">Japan</span>

        <header class="bg-[#1e3a8a] text-white p-10 text-center">
            <h1 class="text-2xl font-bold tracking-widest">NJF REGI サービス利用申込</h1>
            <p class="text-sm opacity-70 mt-3">新日本富士アシスト株式会社</p>
        </header>

        <form id="contractForm" class="p-6 space-y-8">
            <section class="space-y-4">
                <h2 class="font-bold border-l-4 border-[#1e3a8a] pl-2 text-lg">1. 契約者情報 (契約会社)</h2>
                <input type="text" id="companyName" required class="w-full border-b-2 p-3 outline-none focus:border-[#1e3a8a]" placeholder="契約会社名（必须）">
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="companyZip" class="p-postal-code border-b-2 p-3 outline-none" placeholder="郵便番号">
                    <input type="text" id="companyAddress" required class="p-region p-locality p-street-address col-span-2 border-b-2 p-3 outline-none" placeholder="会社住所">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <input type="tel" id="companyTel" required class="border-b-2 p-3 outline-none" placeholder="電話番号">
                    <input type="text" id="representative" required class="border-b-2 p-3 outline-none" placeholder="代表者氏名">
                </div>
            </section>

            <section class="space-y-4 pt-4 border-t">
                <div class="flex justify-between items-center">
                    <h2 class="font-bold border-l-4 border-[#1e3a8a] pl-2 text-lg">2. 設置先情報 (店舗)</h2>
                    <button type="button" onclick="copyInfo()" class="text-[10px] bg-blue-50 text-blue-700 px-3 py-1 rounded-full border border-blue-200">契約者と同じ (同上)</button>
                </div>
                <input type="text" id="shopName" required class="w-full border-b-2 p-3 outline-none" placeholder="店舗名">
                <div class="grid grid-cols-3 gap-2">
                    <input type="text" id="shopZip" class="border-b-2 p-3 outline-none" placeholder="郵便番号">
                    <input type="text" id="shopAddress" required class="col-span-2 border-b-2 p-3 outline-none" placeholder="店舗住所">
                </div>
                <input type="tel" id="shopTel" required class="w-full border-b-2 p-3 outline-none" placeholder="店舗電話番号">
                <input type="email" id="email" required class="w-full border-b-2 p-3 outline-none" placeholder="連絡先メールアドレス">
            </section>

            <section class="space-y-4 pt-4 border-t">
                <h2 class="font-bold border-l-4 border-[#1e3a8a] pl-2 text-lg">3. 設置機器の数量</h2>
                <div id="product-list" class="space-y-3"></div>
                
                <div class="bg-blue-50 p-4 rounded-xl space-y-4">
                    <p class="text-xs font-bold text-blue-800">基本利用料 (必須選択)</p>
                    <div class="grid grid-cols-2 gap-3">
                        <label class="flex flex-col items-center p-3 bg-white border-2 rounded-xl cursor-pointer has-[:checked]:border-[#1e3a8a]">
                            <input type="radio" name="basePlan" value="monthly" checked class="hidden" onchange="calc()">
                            <span class="text-[10px] text-slate-500">月額プラン</span><span class="font-bold text-lg">￥8,000</span>
                        </label>
                        <label class="flex flex-col items-center p-3 bg-white border-2 rounded-xl cursor-pointer has-[:checked]:border-[#1e3a8a]">
                            <input type="radio" name="basePlan" value="yearly" class="hidden" onchange="calc()">
                            <span class="text-[10px] text-slate-500">年額プラン</span><span class="font-bold text-lg">￥80,000</span>
                        </label>
                    </div>
                    <label class="flex items-center justify-between p-3 bg-white border-2 rounded-xl cursor-pointer">
                        <div class="flex items-center">
                            <input type="checkbox" id="qrOption" class="w-5 h-5 mr-3 accent-[#1e3a8a]" onchange="calc()">
                            <div><span class="font-bold text-sm">QR注文サービス</span><p id="qrPriceHint" class="text-[10px] text-slate-400">月額 +￥4,000</p></div>
                        </div>
                        <div id="qrActivePrice" class="font-bold text-blue-900">￥0</div>
                    </label>
                </div>

                <div class="bg-[#0f172a] text-white p-6 rounded-2xl text-center shadow-lg">
                    <p class="text-xs opacity-60 mb-1">初期費用 総計 (10%税込)</p>
                    <p id="total-display" class="text-4xl font-bold">￥0</p>
                </div>
            </section>

            <section class="space-y-3 pt-4 border-t">
                <h2 class="font-bold border-l-4 border-[#1e3a8a] pl-2 text-lg">4. ご署名</h2>
                <div class="relative">
                    <canvas id="signaturePad" class="signature-pad w-full" height="200"></canvas>
                    <button type="button" onclick="clearSig()" class="absolute top-2 right-2 text-[10px] bg-white border px-3 py-1 rounded shadow-sm">クリア</button>
                </div>
            </section>

            <button type="submit" id="submitBtn" class="w-full bg-[#1e3a8a] text-white font-bold py-5 rounded-2xl shadow-xl active:scale-95 transition-all text-xl">お申込を確定する</button>
        </form>
    </div>

    <script>
        let productData = [];
        const API_URL = "https://script.google.com/macros/s/AKfycbwIP-XgdD0fqd4Zhe3tsN7iAWXoIuiEs_7jVBEH6ZXGmESG_4qxNde8k0hrgwAKscz56w/exec"; // <--- 这里填 exec 结尾的链接

        const canvas = document.getElementById('signaturePad');
        const ctx = canvas.getContext('2d');
        let drawing = false;

        window.onload = () => {
            canvas.width = canvas.offsetWidth;
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.lineCap = 'round';
            ctx.strokeStyle = '#0f172a';
            fetchData();
        };

        function fetchData() {
            fetch(API_URL).then(res => res.json()).then(data => {
                productData = data;
                const list = document.getElementById('product-list');
                list.innerHTML = '';
                data.forEach((p, i) => {
                    if(p.name.includes("利用料") || p.name.includes("QR")) return;
                    list.innerHTML += `
                        <div class="flex items-center justify-between p-4 bg-slate-50 rounded-xl">
                            <span class="font-bold text-sm">${p.name}</span>
                            <div class="flex items-center border bg-white rounded-lg">
                                <button type="button" onclick="changeQty(${i},-1)" class="px-3 py-1 border-r">-</button>
                                <input type="number" value="0" id="qty-${i}" data-index="${i}" class="qty-input w-10 text-center font-bold" readonly>
                                <button type="button" onclick="changeQty(${i},1)" class="px-3 py-1 border-l">+</button>
                            </div>
                        </div>`;
                });
                calc();
            });
        }

        function changeQty(idx, d) {
            const el = document.getElementById(`qty-${idx}`);
            let v = parseInt(el.value) + d;
            el.value = v < 0 ? 0 : v;
            calc();
        }

        function copyInfo() {
            document.getElementById('shopName').value = document.getElementById('companyName').value;
            document.getElementById('shopZip').value = document.getElementById('companyZip').value;
            document.getElementById('shopAddress').value = document.getElementById('companyAddress').value;
            document.getElementById('shopTel').value = document.getElementById('companyTel').value;
        }

        function calc() {
            let total = 0;
            const isYearly = document.querySelector('input[name="basePlan"]:checked').value === 'yearly';
            document.querySelectorAll('.qty-input').forEach(input => {
                total += input.value * productData[input.dataset.index].price * 1.1;
            });
            const base = isYearly ? 80000 : 8000;
            const qr = isYearly ? 40000 : 4000;
            total += base * 1.1;
            document.getElementById('qrPriceHint').innerText = isYearly ? "年額 +￥40,000" : "月額 +￥4,000";
            if(document.getElementById('qrOption').checked) {
                total += qr * 1.1;
                document.getElementById('qrActivePrice').innerText = "￥"+(qr*1.1).toLocaleString();
            } else {
                document.getElementById('qrActivePrice').innerText = "￥0";
            }
            document.getElementById('total-display').innerText = "￥" + Math.floor(total).toLocaleString();
        }

        // 签名逻辑适配手机
        const getPos = (e) => {
            const r = canvas.getBoundingClientRect();
            const tx = e.touches ? e.touches[0].clientX : e.clientX;
            const ty = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: tx - r.left, y: ty - r.top };
        };
        canvas.addEventListener('mousedown', (e) => { drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
        canvas.addEventListener('mousemove', (e) => { if(!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
        canvas.addEventListener('mouseup', () => drawing = false);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); drawing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); if(!drawing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); });
        function clearSig() { ctx.clearRect(0, 0, canvas.width, canvas.height); }

        document.getElementById('contractForm').onsubmit = async (e) => {
            e.preventDefault();
            const isBlank = canvas.toDataURL() === canvas.cloneNode().toDataURL();
            if(isBlank) { alert("署名をお願いします。"); return; }
            
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerText = "送信中...";

            const items = [];
            document.querySelectorAll('.qty-input').forEach(input => {
                if(input.value > 0) {
                    const p = productData[input.dataset.index];
                    items.push({ name: p.name, count: input.value, subtotal: input.value * p.price * 1.1 });
                }
            });
            const isYearly = document.querySelector('input[name="basePlan"]:checked').value === 'yearly';
            items.push({ name: isYearly ? "基本料(年)" : "基本料(月)", count: 1, subtotal: (isYearly?80000:8000)*1.1 });
            if(document.getElementById('qrOption').checked) {
                items.push({ name: isYearly ? "QR注文(年)" : "QR注文(月)", count: 1, subtotal: (isYearly?40000:4000)*1.1 });
            }

            const payload = {
                companyName: document.getElementById('companyName').value,
                companyZip: document.getElementById('companyZip').value,
                companyAddress: document.getElementById('companyAddress').value,
                companyTel: document.getElementById('companyTel').value,
                representative: document.getElementById('representative').value,
                shopName: document.getElementById('shopName').value,
                shopZip: document.getElementById('shopZip').value,
                shopAddress: document.getElementById('shopAddress').value,
                shopTel: document.getElementById('shopTel').value,
                email: document.getElementById('email').value,
                items: items,
                total: document.getElementById('total-display').innerText,
                signature: canvas.toDataURL('image/png')
            };

            try {
                const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
                const resData = await res.json();
                if(resData.status === "success") { alert("送信完了！"); location.reload(); }
                else { throw new Error(resData.msg); }
            } catch (err) {
                alert("エラー: " + err.message);
                btn.disabled = false; btn.innerText = "お申込を確定する";
            }
        };
    </script>
</body>
</html>
